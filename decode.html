<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>JWT Decoded — KeyToken Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>
<div class="wrapper">
  <header>
    <div class="logo">🔍</div>
    <div>
      <h1>JWT PAYLOAD DECODED</h1>
      <div class="subtitle">KeyToken Manager · Keycloak OpenID Connect</div>
    </div>
  </header>

  <div id="loading">⏳ Carregando payload...</div>
  <div id="error-msg"></div>

  <div id="content" style="display:none">
    <div class="roles-section" id="roles-section" style="display:none">
      <div class="roles-toolbar">
        <span class="roles-title">🎭 ROLES <span class="roles-total" id="roles-total"></span></span>
        <div class="roles-actions">
          <button type="button" class="roles-btn" id="roles-fullname" aria-pressed="false" title="Exibir o nome completo de cada role">🏷️ Nome completo</button>
          <button type="button" class="roles-btn" id="roles-expand" title="Expandir/recolher todos os grupos">⊞ Expandir</button>
          <button type="button" class="roles-btn" id="roles-copy" title="Copiar as roles visíveis (uma por linha)">📋 Copiar visíveis</button>
        </div>
      </div>
      <div class="roles-search-wrap">
        <span class="roles-search-icon">🔍</span>
        <input type="text" id="roles-search" class="roles-search" placeholder="Filtrar por nome completo ou parte (ex.: ROLE_SROP_BOLETIM ou srop visualizar)" autocomplete="off" spellcheck="false" />
        <button type="button" class="roles-search-clear" id="roles-search-clear" title="Limpar filtro (Esc)" style="display:none">✕</button>
      </div>
      <div class="roles-hint">💡 Termos separados por espaço são combinados · <kbd>/</kbd> foca o filtro · <kbd>Esc</kbd> limpa · clique na role para copiar</div>
      <div id="roles-groups"></div>
      <div class="roles-empty" id="roles-empty" style="display:none">Nenhuma role corresponde ao filtro.</div>
    </div>

    <div class="fields-grid" id="fields-grid"></div>
    <button class="raw-toggle" id="raw-toggle">
      { } VER JSON COMPLETO
      <span class="arrow">▼</span>
    </button>
    <pre id="raw-pre"></pre>
  </div>
</div>
<script src="decode.js"></script>
</body>
</html>
